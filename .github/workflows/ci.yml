name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: devsecapp
          POSTGRES_USER: devsecapp
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsecapp -d devsecapp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          POSTGRES_DB: devsecapp
          POSTGRES_USER: devsecapp
          POSTGRES_PASSWORD: change-me
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: pytest

      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: "p/python"

      - name: Run Bandit
        run: bandit -r src -ll

      - name: Run pip-audit
        run: pip-audit --skip-editable

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t devsecapp:${{ github.sha }} .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecapp:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGHclear

          